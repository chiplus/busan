<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="釜山 2026/10/09–10/14 自由行行程表。可拖曳的時間軸、景點櫃、地圖連結與待確認清單。">
<meta name="theme-color" content="#0A3550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="釜山行程">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<title>釜山潮汐行程表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --abyss:#08283C; --deep:#0F3B52; --brine:#0E6E82; --brine-lift:#13899F;
  --foam:#9ED8D8; --haze:#EDF3F4; --shell:#FFFFFF; --shell-2:#F6FAFA;
  --line:#CFDFE2; --line-soft:#E2ECEE;
  --text:#0B2C3E; --text-2:#4A6979; --text-3:#7B95A1;
  --persimmon:#D9542B; --sand:#E8DCC6;
  --grid-dawn:#F5FAFB; --grid-noon:#FDFDFA; --grid-dusk:#FBF1E6; --grid-night:#D3DEE7;
  --block-bg:rgba(255,255,255,.93); --block-shadow:0 1px 2px rgba(8,40,60,.10),0 6px 16px rgba(8,40,60,.07);
  --sheet:#FFFFFF; --chip:#FFFFFF;
  --focus:#13899F;
  --c-food:#D9542B; --c-sight:#0E6E82; --c-play:#3D6EA8; --c-beauty:#A8547E;
  --c-shop:#B5811F; --c-move:#56737F; --c-stay:#3F7458;
  --sans:'DM Sans','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Fraunces','Noto Serif TC',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --abyss:#04141F; --deep:#0A2C3E; --brine:#3BB2C0; --brine-lift:#5FCBD6;
    --foam:#BDE7E6; --haze:#061A26; --shell:#0C2635; --shell-2:#0F2E3F;
    --line:#1D4356; --line-soft:#173544;
    --text:#DCEDEF; --text-2:#9AB8C2; --text-3:#6D8E9B;
    --persimmon:#F0764B; --sand:#5C513C;
    --grid-dawn:#0C3145; --grid-noon:#0E374C; --grid-dusk:#2B3644; --grid-night:#04121C;
    --block-bg:rgba(12,38,53,.94); --block-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    --sheet:#0C2635; --chip:#103041;
    --focus:#5FCBD6;
    --c-food:#F0764B; --c-sight:#3BB2C0; --c-play:#6E9FDA; --c-beauty:#D686AE;
    --c-shop:#DDAB4A; --c-move:#8AA8B4; --c-stay:#6FAE87;
  }
}
:root[data-theme="dark"]{
  --abyss:#04141F; --deep:#0A2C3E; --brine:#3BB2C0; --brine-lift:#5FCBD6;
  --foam:#BDE7E6; --haze:#061A26; --shell:#0C2635; --shell-2:#0F2E3F;
  --line:#1D4356; --line-soft:#173544;
  --text:#DCEDEF; --text-2:#9AB8C2; --text-3:#6D8E9B;
  --persimmon:#F0764B; --sand:#5C513C;
  --grid-dawn:#0C3145; --grid-noon:#0E374C; --grid-dusk:#2B3644; --grid-night:#04121C;
  --block-bg:rgba(12,38,53,.94); --block-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --sheet:#0C2635; --chip:#103041;
  --focus:#5FCBD6;
  --c-food:#F0764B; --c-sight:#3BB2C0; --c-play:#6E9FDA; --c-beauty:#D686AE;
  --c-shop:#DDAB4A; --c-move:#8AA8B4; --c-stay:#6FAE87;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none !important}
img{max-width:100%}
body{background:var(--haze);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- masthead ---------- */
.masthead{position:relative;background:linear-gradient(175deg,#0A3550 0%,#0C4A63 45%,#0E6E82 100%);
  color:#EAF6F7;overflow:hidden;padding:26px 24px 0}
.masthead__inner{position:relative;z-index:2;max-width:1440px;margin:0 auto;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px 32px;padding-bottom:34px}
.wordmark{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wordmark b{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5vw,46px);
  letter-spacing:.01em;line-height:1;text-wrap:balance}
.wordmark span{font-family:var(--serif);font-weight:500;font-size:clamp(14px,2vw,19px);
  letter-spacing:.34em;text-transform:uppercase;color:var(--foam);opacity:.85}
.mast-meta{display:flex;gap:26px;flex-wrap:wrap;margin-left:auto;align-items:flex-end}
.meta{display:flex;flex-direction:column;gap:3px}
.meta dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(234,246,247,.62)}
.meta dd{margin:0;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;color:#EAF6F7}
.meta dd em{font-style:normal;color:var(--foam)}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:88px;z-index:1;display:block}

/* ---------- day rail ---------- */
.rail-wrap{position:sticky;top:0;z-index:30;background:var(--shell);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(8,40,60,.03)}
.rail{max-width:1440px;margin:0 auto;display:flex;gap:8px;padding:10px 24px;
  overflow-x:auto;scrollbar-width:thin;user-select:none;-webkit-user-select:none}
.daychip{flex:0 0 auto;min-width:126px;text-align:left;padding:9px 13px 10px;border-radius:11px;
  border:1px solid var(--line);background:var(--chip);transition:border-color .15s,background .15s,transform .12s}
.daychip:hover{border-color:var(--brine)}
.daychip__top{display:flex;align-items:baseline;gap:7px}
.daychip__d{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.daychip__w{font-size:11px;color:var(--text-3)}
.daychip__l{font-size:12px;color:var(--text-2);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.daychip__n{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:4px}
.daychip[aria-selected="true"]{background:var(--brine);border-color:var(--brine);color:#fff}
.daychip[aria-selected="true"] .daychip__w,
.daychip[aria-selected="true"] .daychip__l,
.daychip[aria-selected="true"] .daychip__n{color:rgba(255,255,255,.82)}
.daychip.dropping{border-color:var(--persimmon);transform:translateY(-2px);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--persimmon) 22%,transparent)}


/* ---------- rail tools ---------- */
.rail-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:0 24px 0 0;flex-wrap:wrap}
.rail-inner>.rail{flex:1;min-width:0;padding-right:0}
.railtools{display:flex;gap:6px;flex:0 0 auto;padding:10px 0;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--shell-2);font-size:12px;color:var(--text-2);
  transition:border-color .14s,color .14s,background .14s;white-space:nowrap}
.tbtn:hover{border-color:var(--brine);color:var(--text)}
.themedot{width:11px;height:11px;border-radius:50%;border:1.5px solid currentColor;
  display:inline-block;flex:0 0 auto}
.themedot.system{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.themedot.light{background:currentColor}
.themedot.dark{background:transparent}
.banner{position:sticky;top:0;z-index:29;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 24px;background:var(--brine);color:#fff;font-size:13px}
.banner .tbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:#fff}
.banner .tbtn:hover{background:rgba(255,255,255,.26);border-color:#fff;color:#fff}

/* ---------- shell ---------- */
.app{max-width:1440px;margin:0 auto;padding:20px 24px 60px;
  display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:20px;align-items:start}

/* ---------- timetable ---------- */
.chart{background:var(--shell);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.chart__head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.chart__title{font-family:var(--serif);font-weight:700;font-size:18px}
.chart__sub{font-size:12px;color:var(--text-2)}
.chart__hint{margin-left:auto;font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.scroller{max-height:min(72vh,1000px);overflow-y:auto;overscroll-behavior:contain;position:relative}
.grid{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);
  user-select:none;-webkit-user-select:none}
.gutter{position:relative;border-right:1px solid var(--line-soft);background:var(--shell)}
.tick{position:absolute;left:0;right:0;padding-right:9px;text-align:right;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--text-3);transform:translateY(-.55em)}
.tick.hour{color:var(--text-2);font-weight:500;font-size:11.5px}
.body{position:relative;background:
  linear-gradient(180deg,var(--grid-dawn) 0%,var(--grid-noon) 26%,var(--grid-noon) 46%,
  var(--grid-dusk) 70%,var(--grid-night) 100%);touch-action:pan-y}
.rule{position:absolute;left:0;right:0;height:1px;background:var(--line-soft);pointer-events:none}
.rule.hour{background:var(--line)}
.zone{position:absolute;left:0;right:0;pointer-events:none;display:flex;align-items:flex-start;
  justify-content:flex-end;padding:5px 9px 0}
.zone span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);opacity:.7}

.ev{position:absolute;border-radius:9px;background:var(--block-bg);box-shadow:var(--block-shadow);
  border:1px solid var(--line-soft);border-left:4px solid var(--cat,var(--brine));
  padding:6px 9px 6px 10px;overflow:hidden;cursor:grab;touch-action:pan-y;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;gap:2px;transition:box-shadow .14s}
.ev:hover{box-shadow:0 2px 4px rgba(8,40,60,.13),0 10px 24px rgba(8,40,60,.11)}
.ev.short{padding-top:3px;padding-bottom:3px;flex-direction:row;align-items:center;gap:7px}
.ev__t{font-family:var(--mono);font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;white-space:nowrap}
.ev__n{font-size:13px;font-weight:500;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.short .ev__n{-webkit-line-clamp:1;font-size:12.5px}
.ev__memo{font-size:11px;color:var(--text-2);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev__flag{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;
  background:var(--persimmon)}
.ev__grip{position:absolute;left:0;right:0;bottom:0;height:11px;cursor:ns-resize;touch-action:none}
.ev__grip::after{content:"";position:absolute;left:50%;bottom:3px;width:26px;height:2px;
  transform:translateX(-50%);border-radius:2px;background:var(--line);opacity:0;transition:opacity .14s}
.ev:hover .ev__grip::after{opacity:1}
.ev.dragging{opacity:.55;cursor:grabbing;z-index:20}
.ev.selected{box-shadow:0 0 0 2px var(--focus),var(--block-shadow)}
.preview{position:absolute;border-radius:9px;border:2px dashed var(--brine);
  background:color-mix(in srgb,var(--brine) 12%,transparent);pointer-events:none;z-index:15;
  display:flex;align-items:center;gap:6px;padding:5px 10px}
.preview b{font-size:12.5px;font-weight:500}
.preview i{font-family:var(--mono);font-size:10.5px;font-style:normal;color:var(--text-2)}
.empty-hint{position:absolute;left:50%;top:34%;transform:translateX(-50%);text-align:center;
  color:var(--text-3);font-size:13px;pointer-events:none;max-width:260px}

/* ---------- side panel ---------- */
.side{background:var(--shell);border:1px solid var(--line);border-radius:14px;
  position:sticky;top:82px;display:flex;flex-direction:column;max-height:calc(100vh - 106px)}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line-soft)}
.tab{flex:1;padding:8px 6px 9px;font-size:13px;font-weight:500;color:var(--text-2);
  border-bottom:2px solid transparent;border-radius:7px 7px 0 0}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--brine)}
.tab u{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:4px}
.panel{padding:12px 12px 14px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.tools{display:flex;gap:7px;margin-bottom:9px}
.search{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--shell-2);font-size:13px}
.search::placeholder{color:var(--text-3)}
.btn{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--shell-2);
  font-size:12.5px;font-weight:500;transition:border-color .14s,background .14s}
.btn:hover{border-color:var(--brine)}
.btn--go{background:var(--brine);border-color:var(--brine);color:#fff}
.btn--go:hover{background:var(--brine-lift);border-color:var(--brine-lift)}
.btn--warn{color:var(--persimmon);border-color:color-mix(in srgb,var(--persimmon) 40%,var(--line))}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.filt{padding:3.5px 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;
  color:var(--text-2);background:var(--shell-2)}
.filt[aria-pressed="true"]{background:var(--cat,var(--brine));border-color:var(--cat,var(--brine));color:#fff}
.spots{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.spot{position:relative;border:1px solid var(--line-soft);border-radius:10px;background:var(--shell-2);
  padding:8px 10px 9px 11px;border-left:3px solid var(--cat,var(--brine));cursor:grab;touch-action:pan-y;
  transition:border-color .14s,transform .12s,box-shadow .14s}
.spot:hover{border-color:var(--line);box-shadow:0 2px 8px rgba(8,40,60,.06)}
.spot.dragging{opacity:.4}
.spot__row{display:flex;align-items:flex-start;gap:8px}
.spot__n{font-size:13px;font-weight:500;line-height:1.35;flex:1;min-width:0}
.spot__ko{font-size:11px;color:var(--text-3);margin-top:1px}
.spot__add{flex:0 0 auto;width:23px;height:23px;border-radius:6px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--text-2);font-size:14px;line-height:1;background:var(--shell)}
.spot__add:hover{background:var(--brine);border-color:var(--brine);color:#fff}
.spot__tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.pill{font-size:10px;letter-spacing:.05em;padding:1.5px 7px;border-radius:999px;
  background:color-mix(in srgb,var(--cat,var(--brine)) 14%,transparent);color:var(--cat,var(--brine));font-weight:500}
.mini{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.mini.on{color:var(--brine)}
.mini.warn{color:var(--persimmon)}
.none{color:var(--text-3);font-size:12.5px;text-align:center;padding:22px 8px}

/* ---------- todo ---------- */
.todos{display:flex;flex-direction:column;gap:7px}
.todo{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:10px;
  border:1px solid var(--line-soft);background:var(--shell-2)}
.todo input{margin-top:2px;width:15px;height:15px;accent-color:var(--brine);flex:0 0 auto}
.todo__t{font-size:12.5px;line-height:1.45}
.todo.done .todo__t{color:var(--text-3);text-decoration:line-through}

/* ---------- detail sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,26,38,.4);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--sheet);
  border-left:1px solid var(--line);z-index:61;transform:translateX(102%);transition:transform .24s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet__head{padding:18px 20px 14px;border-bottom:1px solid var(--line-soft);
  border-top:5px solid var(--cat,var(--brine))}
.sheet__eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sheet__title{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.25;text-wrap:balance}
.sheet__ko{font-size:12.5px;color:var(--text-3);margin-top:4px;font-family:var(--mono)}
.sheet__body{padding:16px 20px 26px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}
.fld input,.fld textarea,.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--shell-2);font-size:13px;width:100%;font-family:inherit}
.fld textarea{min-height:88px;resize:vertical;line-height:1.6}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{display:flex;align-items:center;gap:10px;margin-top:4px;
  font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}
.divider::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.maplink{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:10px;
  text-decoration:none;color:#fff;background:var(--brine);font-size:13.5px;font-weight:500}
.maplink:hover{background:var(--brine-lift)}
.maplink.naver{background:#1EC800}
.maplink.naver:hover{background:#19AC00}
.maplink.google{background:#2E6BA8}
.maplink.google:hover{background:#28609A}
.maplink small{margin-left:auto;font-weight:400;opacity:.8;font-family:var(--mono);font-size:10.5px}
.sheet__foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line-soft);
  background:var(--shell-2)}
.sheet__foot .btn{flex:1}
.x{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;font-size:19px;color:var(--text-2);background:var(--shell-2)}
.x:hover{color:var(--text)}

/* ---------- ghost ---------- */
.ghost{position:fixed;z-index:80;pointer-events:none;padding:7px 12px;border-radius:9px;
  background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--cat,var(--brine));
  box-shadow:0 10px 28px rgba(8,40,60,.24);font-size:13px;font-weight:500;
  transform:translate(-50%,-50%);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}

/* ---------- status ---------- */
.status{position:fixed;left:50%;bottom:18px;transform:translate(-50%,26px);z-index:70;
  padding:8px 15px;border-radius:999px;background:var(--abyss);color:#EAF6F7;font-size:12.5px;
  box-shadow:0 8px 24px rgba(8,40,60,.3);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.status.show{opacity:1;transform:translate(-50%,0)}
.savebar{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);
  padding:0 4px 10px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.dot.ok{background:#3F9E6E}
.dot.busy{background:var(--sand)}

.hint-wide{display:inline}
.hint-narrow{display:none}
@media (max-width:1080px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .panel{max-height:60vh}
  .scroller{max-height:70vh}
  .hint-wide{display:none}
  .hint-narrow{display:inline}
}
@media (max-width:640px){
  .rail-inner{padding-right:16px;gap:0}

/* ---- share link ---- */
function b64url(bytes){
  var s="",CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64url(str){
  var s=str.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  var bin=atob(s), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function encodeState(obj){
  var bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==="function"){
    var cs=new CompressionStream("gzip"), w=cs.writable.getWriter();
    w.write(bytes); w.close();
    return new Response(cs.readable).arrayBuffer().then(function(buf){
      return "g"+b64url(new Uint8Array(buf));
    });
  }
  return Promise.resolve("r"+b64url(bytes));
}
function decodeState(code){
  var kind=code.charAt(0), bytes=unb64url(code.slice(1));
  if(kind==="g"){
    if(typeof DecompressionStream!=="function") return Promise.reject(new Error("這個瀏覽器不支援解壓縮"));
    var ds=new DecompressionStream("gzip"), w=ds.writable.getWriter();
    w.write(bytes); w.close();
    return new Response(ds.readable).arrayBuffer().then(function(buf){
      return JSON.parse(new TextDecoder().decode(new Uint8Array(buf)));
    });
  }
  return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
}

function buildGutter(){
  var g=$("gutter"); g.innerHTML=""; g.style.height=GRID_H+"px";
  for(var m=DAY_START;m<=DAY_END;m+=SNAP){
    var isHour=(m%60===0);
    var t=el("div","tick"+(isHour?" hour":""),fmt(m));
    t.style.top=((m-DAY_START)*PPM)+"px";
    g.appendChild(t);
  }
}
function layoutCols(list){
  var sorted=list.slice().sort(function(a,b){ return a.start-b.start||a.dur-b.dur; });
  var out={}, cluster=[], end=-1;
  function flush(){
    if(!cluster.length) return;
    var cols=[];
    cluster.forEach(function(e){
      var placed=false;
      for(var i=0;i<cols.length;i++){ if(cols[i]<=e.start){ cols[i]=e.start+e.dur; out[e.id]={c:i}; placed=true; break; } }
      if(!placed){ cols.push(e.start+e.dur); out[e.id]={c:cols.length-1}; }
    });
    cluster.forEach(function(e){ out[e.id].t=cols.length; });
    cluster=[]; end=-1;
  }
  sorted.forEach(function(e){
    if(cluster.length && e.start>=end) flush();
    cluster.push(e); end=Math.max(end,e.start+e.dur);
  });
  flush();
  return out;
}
function renderGrid(){
  var day=DAYS.filter(function(d){return d.id===activeDay;})[0];
  $("chartTitle").textContent=day.date+"(週"+day.dow+") "+day.label;
  $("chartSub").textContent="住宿:"+day.stay;
  var b=$("gridBody"); b.innerHTML=""; b.style.height=GRID_H+"px";
  buildGutter();

  for(var m=DAY_START;m<=DAY_END;m+=SNAP){
    var r=el("div","rule"+(m%60===0?" hour":""));
    r.style.top=((m-DAY_START)*PPM)+"px"; b.appendChild(r);
  }
  [[450,720,"morning"],[720,1020,"afternoon"],[1020,1320,"evening"]].forEach(function(z){
    var d=el("div","zone"); d.style.top=((z[0]-DAY_START)*PPM)+"px";
    d.style.height=((z[1]-z[0])*PPM)+"px"; d.appendChild(el("span",null,z[2])); b.appendChild(d);
  });

  var list=eventsOf(activeDay);
  if(!list.length){
    var h=el("div","empty-hint","這天還是空的。從右邊的景點櫃拖一個過來,或按景點卡上的「＋」。");
    b.appendChild(h);
  }
  var cols=layoutCols(list);
  list.forEach(function(e){ b.appendChild(evNode(e,cols[e.id])); });
}
function evNode(e,pos){
  var s=spotOf(e.spot);
  var name=s?s.name:(e.title||"未命名");
  var cat=s?s.cat:"sight";
  var n=el("div","ev"); n.dataset.ev=e.id;
  n.style.setProperty("--cat",catVar(cat));
  n.style.top=((e.start-DAY_START)*PPM)+"px";
  n.style.height=(e.dur*PPM-3)+"px";
  var t=pos?pos.t:1, c=pos?pos.c:0;
  n.style.left="calc("+(c*100/t)+"% + 6px)";
  n.style.width="calc("+(100/t)+"% - 12px)";
  if(e.dur<=45) n.classList.add("short");
  if(sel===e.id) n.classList.add("selected");
  if(drag&&drag.moved&&drag.id===e.id) n.classList.add("dragging");
  n.appendChild(el("div","ev__t",fmt(e.start)+"–"+fmt(e.start+e.dur)));
  n.appendChild(el("div","ev__n",name));
  if(e.dur>=90&&e.memo) n.appendChild(el("div","ev__memo",e.memo));
  var warn=(e.memo&&e.memo.indexOf("⚠")>-1)||(s&&s.notes&&s.notes.indexOf("⚠")>-1);
  if(warn) n.appendChild(el("div","ev__flag"));
  var grip=el("div","ev__grip"); n.appendChild(grip);
  grip.addEventListener("pointerdown",function(pe){ pe.stopPropagation(); beginDrag(pe,{mode:"resize",id:e.id}); });
  n.addEventListener("pointerdown",function(pe){ beginDrag(pe,{mode:"move",id:e.id}); });
  return n;
}

/* ============ drag ============ */
var drag=null, ghost=null, preview=null, rafId=null, lastDragEnd=0;
var gridBody=$("gridBody"), scroller=$("scroller");

function beginDrag(pe,spec){
  if(pe.pointerType==="mouse"&&pe.button!==0) return;
  if(pe.pointerType==="mouse") pe.preventDefault();
  try{ var g=window.getSelection(); if(g&&g.removeAllRanges) g.removeAllRanges(); }catch(err){}
  drag={mode:spec.mode,id:spec.id,spot:spec.spot,x0:pe.clientX,y0:pe.clientY,moved:false,dayTarget:null};
  if(spec.mode==="move"||spec.mode==="resize"){
    var e=evOf(spec.id); if(!e){drag=null;return;}
    drag.e=e; drag.origStart=e.start; drag.origDur=e.dur;
    drag.grab=minutesAt(pe.clientY)-e.start;
  }
  document.addEventListener("pointermove",onMove);
  document.addEventListener("pointerup",onUp);
  document.addEventListener("pointercancel",onUp);
}
function minutesAt(y){
  var r=gridBody.getBoundingClientRect();
  return DAY_START+(y-r.top)/PPM;
}
function inGrid(x,y){
  var r=gridBody.getBoundingClientRect();
  return x>=r.left-20&&x<=r.right+20&&y>=r.top-40&&y<=r.bottom+40;
}
function onMove(pe){
  if(!drag) return;
  if(!drag.moved){
    if(Math.abs(pe.clientX-drag.x0)<4&&Math.abs(pe.clientY-drag.y0)<4) return;
    drag.moved=true;
    if(drag.mode==="new"){
      var s=spotOf(drag.spot);
      ghost=el("div","ghost",s?s.name:"項目");
      ghost.style.setProperty("--cat",catVar(s?s.cat:"sight"));
      document.body.appendChild(ghost);
      var card=document.querySelector('[data-spot="'+drag.spot+'"]');
      if(card) card.classList.add("dragging");
    } else {
      var node=document.querySelector('[data-ev="'+drag.id+'"]');
      if(node) node.classList.add("dragging");
    }
  }
  pe.preventDefault();
  if(ghost){ ghost.style.left=pe.clientX+"px"; ghost.style.top=(pe.clientY-22)+"px"; }

  var chip=null;
  var under=document.elementFromPoint(pe.clientX,pe.clientY);
  if(under&&under.closest) chip=under.closest("[data-day]");
  document.querySelectorAll(".daychip.dropping").forEach(function(n){n.classList.remove("dropping");});
  drag.dayTarget=null;
  if(chip&&chip.dataset.day!==activeDay){ chip.classList.add("dropping"); drag.dayTarget=chip.dataset.day; }

  autoScroll(pe.clientY);

  if(drag.mode==="resize"){
    var d=snapMin(minutesAt(pe.clientY)-drag.e.start);
    drag.e.dur=clamp(d,SNAP,DAY_END-drag.e.start);
    renderGridLive();
  } else if(drag.mode==="move"){
    var st=snapMin(minutesAt(pe.clientY)-drag.grab);
    drag.e.start=clamp(st,DAY_START,DAY_END-drag.e.dur);
    renderGridLive();
  } else if(drag.mode==="new"){
    if(!drag.dayTarget&&inGrid(pe.clientX,pe.clientY)){
      var s2=snapMin(minutesAt(pe.clientY)-30);
      s2=clamp(s2,DAY_START,DAY_END-60);
      showPreview(s2,60);
    } else hidePreview();
  }
}
function renderGridLive(){
  if(rafId) return;
  rafId=requestAnimationFrame(function(){ rafId=null; renderGrid(); });
}
function showPreview(start,dur){
  if(!preview){ preview=el("div","preview"); gridBody.appendChild(preview); }
  if(!preview.parentNode) gridBody.appendChild(preview);
  preview.style.top=((start-DAY_START)*PPM)+"px";
  preview.style.height=(dur*PPM-3)+"px";
  preview.style.left="6px"; preview.style.right="6px";
  preview.innerHTML="";
  var s=spotOf(drag.spot);
  var b=el("b",null,s?s.name:""); var i=el("i",null,fmt(start)+"–"+fmt(start+dur));
  preview.appendChild(b); preview.appendChild(i);
  preview.dataset.start=start;
}
function hidePreview(){ if(preview&&preview.parentNode) preview.parentNode.removeChild(preview); }
function autoScroll(y){
  var r=scroller.getBoundingClientRect();
  if(y<r.top+56) scroller.scrollTop-=10;
  else if(y>r.bottom-56) scroller.scrollTop+=10;
}
function onUp(pe){
  document.removeEventListener("pointermove",onMove);
  document.removeEventListener("pointerup",onUp);
  document.removeEventListener("pointercancel",onUp);
  document.querySelectorAll(".daychip.dropping").forEach(function(n){n.classList.remove("dropping");});
  document.querySelectorAll(".dragging").forEach(function(n){n.classList.remove("dragging");});
  if(ghost&&ghost.parentNode){ ghost.parentNode.removeChild(ghost); } ghost=null;
  if(!drag){ return; }
  var d=drag;
  if(d.moved) lastDragEnd=Date.now();

  if(!d.moved){
    drag=null; hidePreview();
    if(d.mode==="new") openSpotSheet(d.spot);
    else { sel=d.id; openEventSheet(d.id); renderGrid(); }
    return;
  }

  if(d.mode==="new"){
    var start=preview?parseInt(preview.dataset.start,10):null;
    hidePreview();
    if(d.dayTarget){
      var tmp=activeDay; activeDay=d.dayTarget;
      quickAdd(d.spot); activeDay=tmp; renderRail(); renderGrid(); renderSpots();
      toast("已加到 "+DAYS.filter(function(x){return x.id===d.dayTarget;})[0].date);
    } else if(start!=null&&!isNaN(start)){
      addEvent(activeDay,d.spot,start,60);
    }
  } else {
    hidePreview();
    if(d.dayTarget&&d.mode==="move"){
      d.e.day=d.dayTarget;
      toast("已移到 "+DAYS.filter(function(x){return x.id===d.dayTarget;})[0].date);
    }
    persist(); renderRail(); renderGrid(); renderSpots();
  }
  drag=null;
}

/* click empty grid → new custom entry */
gridBody.addEventListener("click",function(e){
  if(e.target!==gridBody) return;
  if(Date.now()-lastDragEnd<350) return;
  var m=snapMin(minutesAt(e.clientY)-30);
  openNewSheet(clamp(m,DAY_START,DAY_END-60));
});

/* ============ sheet ============ */
var sheet=$("sheet"), scrim=$("scrim");
function closeSheet(){
  sheet.classList.remove("open"); scrim.classList.remove("open");
  sheet.setAttribute("aria-hidden","true"); sheetCtx=null;
  if(sel){ sel=null; renderGrid(); }
}
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });

function timeOptions(sel,from,to,step,fmtFn){
  var s=document.createElement("select");
  for(var v=from;v<=to;v+=step){
    var o=document.createElement("option"); o.value=v; o.textContent=fmtFn(v);
    if(v===sel) o.selected=true; s.appendChild(o);
  }
  return s;
}
function field(label,node){
  var f=el("div","fld"); var l=el("label",null,label); f.appendChild(l); f.appendChild(node); return f;
}
function mapButton(url){
  var k=mapKind(url); if(!k) return null;
  var a=document.createElement("a"); a.className="maplink "+k; a.href=url;
  a.target="_blank"; a.rel="noopener noreferrer";
  a.appendChild(el("span",null,mapLabel(k)));
  a.appendChild(el("small",null,k==="naver"?"NAVER":k==="google"?"GOOGLE":"WEB"));
  return a;
}
function openSheet(){
  sheet.classList.add("open"); scrim.classList.add("open"); sheet.setAttribute("aria-hidden","false");
}

function spotEditor(s,onChange){
  var frag=document.createDocumentFragment();
  var name=document.createElement("input"); name.value=s.name;
  name.addEventListener("input",function(){ s.name=name.value; onChange(); });
  frag.appendChild(field("名稱",name));

  var ko=document.createElement("input"); ko.value=s.ko||""; ko.placeholder="韓文名(選填,方便給司機看)";
  ko.addEventListener("input",function(){ s.ko=ko.value; onChange(); });
  frag.appendChild(field("韓文",ko));

  var cat=document.createElement("select");
  CAT_ORDER.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=CATS[c].label;
    if(s.cat===c)o.selected=true; cat.appendChild(o); });
  cat.addEventListener("change",function(){ s.cat=cat.value; onChange(); refreshSheetAccent(s.cat); });
  frag.appendChild(field("分類",cat));

  var url=document.createElement("input"); url.value=s.url||"";
  url.placeholder="貼 Naver 或 Google 地圖網址";
  var linkSlot=el("div");
  function paintLink(){
    linkSlot.innerHTML="";
    var b=mapButton(s.url); if(b) linkSlot.appendChild(b);
    else linkSlot.appendChild(el("div","mini","尚未加入網址"));
  }
  url.addEventListener("input",function(){ s.url=url.value.trim(); onChange(); paintLink(); });
  frag.appendChild(field("地圖網址",url));
  paintLink();
  frag.appendChild(linkSlot);

  var notes=document.createElement("textarea"); notes.value=s.notes||"";
  notes.placeholder="營業時間、訂位方式、必點、注意事項…";
  notes.addEventListener("input",function(){ s.notes=notes.value; onChange(); });
  frag.appendChild(field("備註",notes));
  return frag;
}
function refreshSheetAccent(cat){
  var h=sheet.querySelector(".sheet__head"); if(h) h.style.setProperty("--cat",catVar(cat));
}

function openEventSheet(id){
  var e=evOf(id); if(!e) return;
  var s=spotOf(e.spot);
  sheetCtx={kind:"event",id:id};
  sheet.innerHTML="";
  var head=el("div","sheet__head"); head.style.setProperty("--cat",catVar(s?s.cat:"sight"));
  var eyebrow=el("div","sheet__eyebrow");
  var day=DAYS.filter(function(d){return d.id===e.day;})[0];
  eyebrow.appendChild(el("span","mini",day.date+"(週"+day.dow+")"));
  var p=el("span","pill",s?CATS[s.cat].label:"行程"); p.style.setProperty("--cat",catVar(s?s.cat:"sight"));
  eyebrow.appendChild(p);
  eyebrow.appendChild(el("span","mini",fmt(e.start)+"–"+fmt(e.start+e.dur)));
  head.appendChild(eyebrow);
  head.appendChild(el("div","sheet__title",s?s.name:"行程"));
  if(s&&s.ko) head.appendChild(el("div","sheet__ko",s.ko));
  var x=el("button","x","✕"); x.addEventListener("click",closeSheet); head.appendChild(x);
  sheet.appendChild(head);

  var body=el("div","sheet__body");
  var times=el("div","times");
  var st=timeOptions(e.start,DAY_START,DAY_END-SNAP,SNAP,fmt);
  var du=timeOptions(e.dur,SNAP,480,SNAP,function(v){
    return v<60 ? (v+" 分") : (Math.floor(v/60)+" 小時"+(v%60?" 30 分":"")); });
  st.addEventListener("change",function(){ e.start=clamp(+st.value,DAY_START,DAY_END-e.dur); persist(); renderGrid(); openEventSheet(id); });
  du.addEventListener("change",function(){ e.dur=clamp(+du.value,SNAP,DAY_END-e.start); persist(); renderGrid(); openEventSheet(id); });
  times.appendChild(field("開始",st)); times.appendChild(field("長度",du));
  body.appendChild(times);

  var dsel=document.createElement("select");
  DAYS.forEach(function(d){ var o=document.createElement("option"); o.value=d.id;
    o.textContent=d.date+"(週"+d.dow+") "+d.label; if(d.id===e.day)o.selected=true; dsel.appendChild(o); });
  dsel.addEventListener("change",function(){ e.day=dsel.value; activeDay=e.day; persist(); renderAll(); openEventSheet(id); });
  body.appendChild(field("哪一天",dsel));

  var memo=document.createElement("textarea"); memo.value=e.memo||"";
  memo.placeholder="這一天的臨時備註,例如「先抽號」「訂窗邊位」";
  memo.style.minHeight="64px";
  memo.addEventListener("input",function(){ e.memo=memo.value; persist(); renderGridLive(); });
  body.appendChild(field("當日備註",memo));

  if(s){
    body.appendChild(el("div","divider","景點資料"));
    body.appendChild(spotEditor(s,function(){ persist(); renderGridLive(); renderSpots(); }));
  }
  sheet.appendChild(body);

  var foot=el("div","sheet__foot");
  var dup=el("button","btn","複製一份");
  dup.addEventListener("click",function(){
    var n=addEvent(e.day,e.spot,Math.min(e.start+e.dur,DAY_END-30),e.dur); n.memo=e.memo; persist(); renderGrid();
    toast("已複製");
  });
  var del=el("button","btn btn--warn","從行程移除");
  var armed=false;
  del.addEventListener("click",function(){
    if(!armed){ armed=true; del.textContent="再按一次確認刪除"; setTimeout(function(){armed=false;del.textContent="從行程移除";},3000); return; }
    state.events=state.events.filter(function(x){return x.id!==id;});
    persist(); closeSheet(); renderAll(); toast("已移除");
  });
  foot.appendChild(dup); foot.appendChild(del);
  sheet.appendChild(foot);
  openSheet();
}

function openSpotSheet(spotId){
  var s=spotOf(spotId); if(!s) return;
  sheetCtx={kind:"spot",id:spotId};
  sheet.innerHTML="";
  var head=el("div","sheet__head"); head.style.setProperty("--cat",catVar(s.cat));
  var eyebrow=el("div","sheet__eyebrow");
  var p=el("span","pill",CATS[s.cat].label); p.style.setProperty("--cat",catVar(s.cat));
  eyebrow.appendChild(p);
  var used=state.events.filter(function(e){return e.spot===s.id;});
  eyebrow.appendChild(el("span","mini",used.length?("已排入 "+used.length+" 個時段"):"尚未排入行程"));
  head.appendChild(eyebrow);
  head.appendChild(el("div","sheet__title",s.name));
  if(s.ko) head.appendChild(el("div","sheet__ko",s.ko));
  var x=el("button","x","✕"); x.addEventListener("click",closeSheet); head.appendChild(x);
  sheet.appendChild(head);

  var body=el("div","sheet__body");
  body.appendChild(spotEditor(s,function(){ persist(); renderSpots(); renderGridLive(); }));
  sheet.appendChild(body);

  var foot=el("div","sheet__foot");
  var addb=el("button","btn btn--go","加到 "+DAYS.filter(function(d){return d.id===activeDay;})[0].date);
  addb.addEventListener("click",function(){ quickAdd(s.id); closeSheet(); });
  var del=el("button","btn btn--warn","刪除景點");
  var armed=false;
  del.addEventListener("click",function(){
    if(!armed){ armed=true; del.textContent="再按一次確認"; setTimeout(function(){armed=false;del.textContent="刪除景點";},3000); return; }
    state.spots=state.spots.filter(function(x){return x.id!==s.id;});
    state.events=state.events.filter(function(e){return e.spot!==s.id;});
    persist(); closeSheet(); renderAll(); toast("已刪除景點與相關行程");
  });
  foot.appendChild(addb); foot.appendChild(del);
  sheet.appendChild(foot);
  openSheet();
}

function openNewSheet(start){
  var s={id:uid("s"),name:"",ko:"",cat:"sight",url:"",notes:""};
  sheet.innerHTML="";
  var head=el("div","sheet__head"); head.style.setProperty("--cat",catVar("sight"));
  head.appendChild(el("div","sheet__eyebrow")).appendChild(el("span","mini","新增景點"));
  head.appendChild(el("div","sheet__title","新的景點"));
  var x=el("button","x","✕"); x.addEventListener("click",closeSheet); head.appendChild(x);
  sheet.appendChild(head);
  var body=el("div","sheet__body");
  body.appendChild(spotEditor(s,function(){ refreshSheetAccent(s.cat); }));
  sheet.appendChild(body);
  var foot=el("div","sheet__foot");
  var save=el("button","btn","只存進景點櫃");
  var saveAdd=el("button","btn btn--go", start!=null?("存並排在 "+fmt(start)):"存並加到今天");
  function commit(){
    if(!s.name.trim()){ toast("先給它一個名字"); return false; }
    state.spots.unshift(s); return true;
  }
  save.addEventListener("click",function(){ if(commit()){ persist(); closeSheet(); renderAll(); toast("已存進景點櫃"); } });
  saveAdd.addEventListener("click",function(){
    if(!commit()) return;
    addEvent(activeDay,s.id,start!=null?start:DAY_START+120,60);
    closeSheet(); renderAll(); toast("已排入行程");
  });
  foot.appendChild(save); foot.appendChild(saveAdd);
  sheet.appendChild(foot);
  openSheet();
}

/* ============ wiring ============ */
$("search").addEventListener("input",function(e){ query=e.target.value; renderSpots(); });
$("addSpot").addEventListener("click",function(){ openNewSheet(null); });
$("addTodo").addEventListener("click",function(){
  state.todos.push({id:uid("t"),text:"新的待辦事項",done:false}); persist(); renderTodos();
});
var resetArmed=false;
$("resetAll").addEventListener("click",function(){
  var b=$("resetAll");
  if(!resetArmed){ resetArmed=true; b.textContent="再按一次:會清掉你的所有調整";
    setTimeout(function(){resetArmed=false;b.textContent="回復預設行程";},4000); return; }
  state=seed(); viewingShared=false; hideBanner(); persist(); renderAll(); b.textContent="回復預設行程"; resetArmed=false; toast("已回復預設");
});
$("tabSpots").addEventListener("click",function(){ switchTab("spots"); });
$("tabTodos").addEventListener("click",function(){ switchTab("todos"); });
function switchTab(which){
  var a=which==="spots";
  $("tabSpots").setAttribute("aria-selected",a?"true":"false");
  $("tabTodos").setAttribute("aria-selected",a?"false":"true");
  $("panelSpots").hidden=!a; $("panelTodos").hidden=a;
}

function renderAll(){ renderRail(); renderGrid(); renderFilters(); renderSpots(); renderTodos(); }
function scrollToDay(){
  var list=eventsOf(activeDay), anchor=540;
  if(list.length) anchor=list.reduce(function(a,b){ return a.start<b.start?a:b; }).start;
  scroller.scrollTop=Math.max(0,(anchor-DAY_START)*PPM-46);
}
renderAll(); scrollToDay();
})();
</script>
