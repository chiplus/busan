<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="釜山 2026/10/09–10/14 自由行行程表。可拖曳的時間軸、景點櫃、地圖連結與待確認清單。">
<meta name="theme-color" content="#0A3550">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="釜山行程">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=10" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png?v=10">
<title>2026 Busan Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    registrations.forEach(reg => reg.unregister());
  });
  caches.keys().then(names => {
    names.forEach(name => caches.delete(name));
  });
}
</script>
</head>
<body>

<header class="masthead">
  <div class="masthead__inner">
    <div class="wordmark">
      <b>釜山</b><span>Busan</span>
    </div>
    <div class="mast-meta">
      <dl class="meta"><dt>日期</dt><dd>10.09 – 10.14 <em id="countdown"></em></dd></dl>
      <dl class="meta"><dt>去程</dt><dd>TPE 16:40 → PUS 19:55</dd></dl>
      <dl class="meta"><dt>回程</dt><dd>PUS 20:00 → TPE 21:20</dd></dl>
    </div>
  </div>
  <svg class="waves" viewBox="0 0 1440 88" preserveAspectRatio="none" aria-hidden="true">
    <g class="bridge" opacity=".34" fill="none" stroke="#9ED8D8">
      <path d="M420 44 L880 44" stroke-width="1.6"/>
      <path d="M560 44 L560 6 M740 44 L740 6" stroke-width="1.6"/>
      <path d="M420 34 Q560 6 650 30 Q740 6 880 34" stroke-width="1.1"/>
      <path d="M470 44 L470 20 M515 44 L515 14 M605 44 L605 15 M650 44 L650 30 M695 44 L695 15 M785 44 L785 14 M830 44 L830 20" stroke-width=".7"/>
    </g>
    <g class="bridge" opacity=".5" fill="#BDE7E6">
      <circle cx="470" cy="47" r="1.3"/><circle cx="515" cy="47" r="1.3"/><circle cx="560" cy="47" r="1.3"/>
      <circle cx="605" cy="47" r="1.3"/><circle cx="650" cy="47" r="1.3"/><circle cx="695" cy="47" r="1.3"/>
      <circle cx="740" cy="47" r="1.3"/><circle cx="785" cy="47" r="1.3"/><circle cx="830" cy="47" r="1.3"/>
    </g>
    <path d="M0 52 C 180 30, 330 74, 520 56 C 700 39, 860 76, 1040 58 C 1210 41, 1330 68, 1440 54 L1440 88 L0 88 Z" fill="#0B4E63" opacity=".55"/>
    <path d="M0 64 C 200 44, 340 84, 540 68 C 730 53, 900 88, 1090 70 C 1250 55, 1350 76, 1440 66 L1440 88 L0 88 Z" fill="#0E6E82" opacity=".7"/>
    <path d="M0 76 C 210 62, 380 92, 580 78 C 780 64, 930 94, 1130 80 C 1290 69, 1370 84, 1440 78 L1440 88 L0 88 Z" fill="#EDF3F4"/>
  </svg>
</header>

<div class="viewbar">
  <div class="viewbar__inner">
    <div class="views" role="tablist" aria-label="檢視">
      <button class="viewtab" id="viewItin" role="tab" aria-selected="true">行程表</button>
      <select class="daysel" id="daySel" aria-label="選擇日期"></select>
      <button class="viewtab" id="viewTodos" role="tab" aria-selected="false">待確認<u id="todoCount"></u></button>
      <button class="viewtab" id="viewTasks" role="tab" aria-selected="false">代辦<u id="taskCount"></u></button>
      <button class="viewtab" id="viewPacking" role="tab" aria-selected="false">要帶<u id="packCount"></u></button>
    </div>
    <div class="railtools">
      <button class="tbtn" id="btnTheme" title="切換淺色／深色"><span class="themedot system" id="themeIcon" aria-hidden="true"></span><span id="themeLabel">系統</span></button>
      <button class="tbtn" id="btnShare" title="產生一段可分享的網址">分享網址</button>
      <button class="tbtn" id="btnExport" title="下載行程備份檔">匯出</button>
      <button class="tbtn" id="btnImport" title="從備份檔還原">匯入</button>
      <input type="file" id="fileIn" accept="application/json,.json" hidden>
    </div>
  </div>
</div>
<div class="banner" id="banner" hidden>
  <span id="bannerText"></span>
  <button class="tbtn" id="bannerSave">存成我的行程</button>
  <button class="tbtn" id="bannerDrop">回到我的行程</button>
</div>

<main class="app">
  <section class="chart" id="panelItin">
    <div class="chart__head">
      <div>
        <div class="chart__title" id="chartTitle">10/09</div>
        <div class="chart__sub" id="chartSub"></div>
      </div>
      <div class="chart__hint">
        <span class="hint-wide">拖曳右側景點放上時間軸 · 拉底邊改長度 · 點一下看細節</span>
        <span class="hint-narrow">用景點卡上的「＋」加入這天 · 點行程開細節面板改時間 · 拉底邊改長度</span>
      </div>
    </div>
    <div class="scroller" id="scroller">
      <div class="grid" id="grid">
        <div class="gutter" id="gutter"></div>
        <div class="body" id="gridBody"></div>
      </div>
    </div>
  </section>

  <section class="chart" id="panelTodos" hidden>
    <div class="chart__head"><div>
      <div class="chart__title">待確認</div>
      <div class="chart__sub">出發前要跟店家、官網確認的事</div>
    </div></div>
    <div class="listwrap">
      <div class="todos" id="todos"></div>
      <button class="btn" id="addTodo">＋ 新增待辦</button>
      <button class="btn btn--warn" id="resetAll">回復預設行程</button>
    </div>
  </section>

  <section class="chart" id="panelTasks" hidden>
    <div class="chart__head"><div>
      <div class="chart__title">代辦</div>
      <div class="chart__sub">出發前要辦的準備工作</div>
    </div></div>
    <div class="listwrap">
      <div class="todos" id="tasks"></div>
      <button class="btn" id="addTask">＋ 新增代辦</button>
    </div>
  </section>

  <section class="chart" id="panelPacking" hidden>
    <div class="chart__head"><div>
      <div class="chart__title">要帶的東西</div>
      <div class="chart__sub">行李打包清單</div>
    </div></div>
    <div class="listwrap">
      <div class="todos" id="packing"></div>
      <button class="btn" id="addPack">＋ 新增物品</button>
    </div>
  </section>

  <aside class="side">
    <div class="side__head">景點櫃<span id="spotCount"></span></div>
    <div class="panel" id="panelSpots">
      <div class="savebar"><span class="dot" id="syncDot"></span><span id="syncText">載入中…</span></div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="搜尋景點、店名、韓文…" aria-label="搜尋景點">
        <button class="btn btn--go" id="addSpot">＋ 新增</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="spots" id="spots"></div>
    </div>
  </aside>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true" aria-label="細節"></aside>
<div class="status" id="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
